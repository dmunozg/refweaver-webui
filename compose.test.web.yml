services:
  db:
    environment:
      POSTGRES_DB: refweaver_webui_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d refweaver_webui_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  bff-test:
    image: docker.io/oven/bun:1.3.10
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "bun install && bun run --filter @refweaver/bff dev"
      ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/refweaver_webui_test
      BETTER_AUTH_SECRET: replace-with-random-secret
      BETTER_AUTH_URL: http://bff-test:3001
      REFWEAVER_API_BASE_URL: http://refweaver.invalid
      REFWEAVER_API_KEY: ""
      BFF_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./:/workspace:Z
      - bun_node_modules_bff_test_runtime:/workspace/node_modules
      - bff_node_modules_test_runtime:/workspace/apps/bff/node_modules
      - db_node_modules_test_runtime:/workspace/packages/db/node_modules

  web-tests:
    image: docker.io/oven/bun:1.3.10
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "bun install && bun run --filter @refweaver/web test"
      ]
    depends_on:
      bff-test:
        condition: service_healthy
    environment:
      VITE_BFF_BASE_URL: http://bff-test:3001
    volumes:
      - ./:/workspace:Z
      - bun_node_modules_web_test:/workspace/node_modules
      - web_node_modules_test:/workspace/apps/web/node_modules

volumes:
  postgres_test_data:
  bun_node_modules_bff_test_runtime:
  bff_node_modules_test_runtime:
  db_node_modules_test_runtime:
  bun_node_modules_web_test:
  web_node_modules_test:
