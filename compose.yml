services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refweaver_webui}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-refweaver_webui}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bff:
    image: docker.io/oven/bun:1.3.10
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "bun install && bun run --filter @refweaver/bff dev"
      ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${BFF_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/refweaver_webui}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-random-secret}
      REFWEAVER_API_BASE_URL: ${REFWEAVER_API_BASE_URL:?REFWEAVER_API_BASE_URL is required}
      REFWEAVER_API_KEY: ${REFWEAVER_API_KEY:-}
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BFF_PORT:-3001}:${BFF_PORT:-3001}"
    volumes:
      - ./:/workspace:Z
      - bun_node_modules_bff:/workspace/node_modules
      - bff_node_modules:/workspace/apps/bff/node_modules
      - db_node_modules:/workspace/packages/db/node_modules

  web:
    image: docker.io/oven/bun:1.3.10
    working_dir: /workspace
    env_file:
      - .env
    command:
      [
        "sh",
        "-lc",
        "bun install && bun run --filter @refweaver/web dev --host 0.0.0.0 --port ${WEB_PORT:-5173}"
      ]
    depends_on:
      - bff
    environment:
      VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-http://localhost:3001}
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    volumes:
      - ./:/workspace:Z
      - bun_node_modules_web:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules

volumes:
  postgres_data:
  bun_node_modules_bff:
  bun_node_modules_web:
  bff_node_modules:
  web_node_modules:
  db_node_modules:
